name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Spinach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle downloads the SDK platform it needs once the licenses are accepted
      - name: Install Android SDK tools
        working-directory: .
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: Spinach/app/build/reports/tests/

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      # the Firestore emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Test firestore.rules in the emulator
        run: npm test
